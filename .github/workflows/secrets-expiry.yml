name: Échéances des secrets

# Avertit à l'approche de l'expiration des PAT et des clés Albert
# (config/secrets-expiry.txt), en ouvrant/mettant à jour une issue ici.
#
# Ce workflow n'utilise QUE `github.token` : il ne lit aucun des secrets qu'il
# surveille et n'a besoin d'aucun PAT. C'est la propriété qui compte — il ne
# peut pas tomber en panne pour la raison même qu'il surveille. Le jour où
# AGENTS_DISPATCH_TOKEN expire, c'est précisément lui qui doit encore parler.
#
# Il ne teste pas la VALIDITÉ des secrets (un secret ne se teste que depuis le
# dépôt qui le détient — ce serait un job dans chaque dépôt de cours) : il
# suit des dates, saisies à la main, faute d'API GitHub exposant l'échéance
# d'un PAT.

on:
  # Hebdomadaire : les échéances se comptent en mois, inutile d'y revenir plus
  # souvent. Minute et heure décalées des valeurs rondes (cf. queue.yml).
  #
  # ATTENTION — comme pour queue.yml, le commit qui modifie ce cron doit être
  # authored par un compte ayant accès au dépôt, jamais par un bot.
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch: {}

concurrency:
  group: secrets-expiry
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  expiry:
    name: Relever les échéances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les échéances
        env:
          GH_TOKEN: ${{ github.token }}
          WARN_DAYS: "30"
        run: bash scripts/check-secrets-expiry.sh
