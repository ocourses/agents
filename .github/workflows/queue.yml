name: File d'attente — migrations (verrou global Albert)

# Dépile la plus ancienne issue `template-migration`, tous dépôts de
# config/course-repos.txt confondus, lui envoie agent-migrate-latex.yml, et
# ATTEND LA FIN avant de rendre la main (scripts/queue-next.sh).
#
# Ce workflow tourne toujours DANS ocourses/agents (jamais en workflow_call) :
# c'est ce qui rend `concurrency:` global. `agent.yml` (workflow_call) a sa
# concurrency scopée au dépôt appelant — un seul agent à la fois PAR DÉPÔT,
# mais rien n'empêche deux dépôts de tourner en même temps, alors que le
# budget Albert (tokens/minute) est partagé par tout le compte. Ici, chaque
# tick tient le job occupé pendant toute la durée du run distant : le tick
# suivant (cron) reste en file (cancel-in-progress: false) jusqu'à la fin.
#
# Nécessite le secret AGENTS_DISPATCH_TOKEN (PAT fine-grained, portée sur les
# dépôts de config/course-repos.txt — Issues + Actions en lecture/écriture,
# Contents + Metadata en lecture). Voir README.md.

on:
  # ATTENTION — le commit qui modifie ce cron DOIT être authored par un compte
  # ayant accès au dépôt (ici ocots). GitHub attribue chaque run `schedule` à
  # l'utilisateur qui a modifié la ligne `cron:` en dernier sur la branche par
  # défaut ; si ce compte n'a pas accès au dépôt, le schedule n'est JAMAIS
  # déclenché — aucune erreur, aucun run, nulle part.
  #
  # C'est exactement ce qui s'est produit : fb6dd74 et 9c5fc29 étaient authored
  # « Claude <noreply@anthropic.com> », que GitHub mappe sur github.com/claude,
  # compte tiers en `permission: none` sur ce dépôt privé. Neuf créneaux
  # consécutifs manqués sur deux expressions cron différentes, alors que tout
  # le reste était sain (state: active, sur main, Actions activé, quota OK) et
  # que le workflow_dispatch marchait — lui est attribué à qui le lance.
  #
  # Donc : ne jamais commiter ce fichier en tant que bot. Le trailer
  # Co-Authored-By est sans effet sur l'attribution ; c'est le champ author qui
  # compte.
  #
  # Minutes décalées des horaires ronds : GitHub documente une charge plus
  # forte à *:00/:15/:30/:45, où les schedules sont plus sujets au retard.
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

concurrency:
  group: agent-albert-global
  cancel-in-progress: false

jobs:
  tick:
    name: Traiter la prochaine cible de la file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret requis
        env:
          TOKEN: ${{ secrets.AGENTS_DISPATCH_TOKEN }}
        run: |
          test -n "$TOKEN" || {
            echo "::error::AGENTS_DISPATCH_TOKEN absent — voir README.md, section « File d'attente »"
            exit 1
          }

      - name: Tick
        env:
          GH_TOKEN: ${{ secrets.AGENTS_DISPATCH_TOKEN }}
        run: bash scripts/queue-next.sh
