name: File d'attente — migrations (verrou global Albert)

# Dépile la plus ancienne issue `template-migration`, tous dépôts de
# config/course-repos.txt confondus, lui envoie agent-migrate-latex.yml, et
# ATTEND LA FIN avant de rendre la main (scripts/queue-next.sh).
#
# Ce workflow tourne toujours DANS ocourses/agents (jamais en workflow_call) :
# c'est ce qui rend `concurrency:` global. `agent.yml` (workflow_call) a sa
# concurrency scopée au dépôt appelant — un seul agent à la fois PAR DÉPÔT,
# mais rien n'empêche deux dépôts de tourner en même temps, alors que le
# budget Albert (tokens/minute) est partagé par tout le compte. Ici, chaque
# tick tient le job occupé pendant toute la durée du run distant : le tick
# suivant (cron) reste en file (cancel-in-progress: false) jusqu'à la fin.
#
# Nécessite le secret AGENTS_DISPATCH_TOKEN (PAT fine-grained, portée sur les
# dépôts de config/course-repos.txt — Issues + Actions en lecture/écriture,
# Contents + Metadata en lecture). Voir README.md.

on:
  # ÉTAT AU 2026-09-12 — ce cron ne s'est JAMAIS déclenché : 14 créneaux
  # manqués sur trois expressions successives (*/15, puis 7,22,37,52, puis
  # 3,18,33,48), alors que workflow_dispatch part au quart de tour.
  #
  # Écarté par VÉRIFICATION, pas par raisonnement — ne pas refaire le tour :
  # fichier présent et identique sur main (branche par défaut), workflow state
  # `active`, dépôt ni fork ni archivé, Actions activé au niveau dépôt ET org,
  # quota loin d'être atteint, aucun run en file, YAML valide, aucun incident
  # GitHub, intervalle >= 5 min.
  #
  # Deux fausses pistes, notées pour qu'on ne les reprenne pas :
  #   1. La contention aux horaires ronds. Les minutes restent décalées (c'est
  #      sain, GitHub documente une charge plus forte à *:00/:15/:30/:45), mais
  #      ça n'a rien changé.
  #   2. L'attribution du run. GitHub documente que l'utilisateur ayant modifié
  #      le cron en dernier reçoit les NOTIFICATIONS — pas que le run soit
  #      bloqué faute d'accès. Les deux commits d'origine étaient authored
  #      « Claude <noreply@anthropic.com> », que GitHub mappe sur
  #      github.com/claude (compte tiers, alors `permission: none`) ; les
  #      ré-attribuer à ocots n'a pas suffi. Commiter ce fichier sous une
  #      identité humaine reste la bonne pratique — pour les notifications, et
  #      le trailer Co-Authored-By n'y change rien, c'est le champ author.
  #
  # Dernière variable non testée, éliminée le 2026-09-12 : le dépôt était
  # privé sur une org en plan Free. Il est désormais PUBLIC.
  #
  # ATTENTION — conséquence directe de ce passage en public : GitHub désactive
  # automatiquement les workflows planifiés d'un dépôt public après 60 JOURS
  # SANS ACTIVITÉ. Si la file se tait après une longue pause (vacances), c'est
  # la première chose à vérifier : Actions -> ce workflow -> « Enable workflow ».
  # Quotidien, chaque nuit à 00h23 : ce n'est plus le cron qui assure le
  # débit. Il ne fait que RELANCER une chaîne éteinte ; c'est l'auto-chaînage
  # (fin de scripts/queue-next.sh) qui enchaîne les ticks tant qu'il reste des
  # tâches, sans dépendre d'un créneau tenu à l'heure.
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "Rang du tick dans la chaîne — interne, laisser 0"
        required: false
        default: "0"
      max_chain:
        description: "Nombre maximum de ticks enchaînés d'affilée"
        required: false
        default: "6"

concurrency:
  group: agent-albert-global
  cancel-in-progress: false

jobs:
  tick:
    name: Traiter la prochaine cible de la file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret requis
        env:
          TOKEN: ${{ secrets.AGENTS_DISPATCH_TOKEN }}
        run: |
          test -n "$TOKEN" || {
            echo "::error::AGENTS_DISPATCH_TOKEN absent — voir README.md, section « File d'attente »"
            exit 1
          }

      - name: Tick
        env:
          GH_TOKEN: ${{ secrets.AGENTS_DISPATCH_TOKEN }}
          # Vides sur un déclenchement `schedule` : la chaîne repart de zéro.
          CHAIN: ${{ inputs.chain || '0' }}
          MAX_CHAIN: ${{ inputs.max_chain || '6' }}
        run: bash scripts/queue-next.sh
