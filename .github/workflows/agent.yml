name: AI Agent

# Workflow RÉUTILISABLE de la base d'agents.
#
# Mécanique figée (scripts) : scaffold -> [OpenCode] -> finalize.
#   scaffold.sh    : issue -> branche -> fichier de suivi -> commit dummy -> PR Draft
#   run-opencode.sh: assemble AGENTS.md + opencode.json, lance `opencode run`
#   finalize.sh    : maj suivi -> push -> commentaire de bilan (PR reste Draft)
#
# Le dépôt appelant fournit un job minimal :
#
#   permissions: { contents: write, issues: write, pull-requests: write }
#   jobs:
#     run:
#       uses: ocourses/agents/.github/workflows/agent.yml@main
#       with: { role: latex-template-migrator, task: "..." }
#       secrets:
#         ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
#         AGENTS_READ_TOKEN: ${{ secrets.AGENTS_READ_TOKEN }}

on:
  workflow_call:
    inputs:
      role:
        description: "Nom du rôle (roles/<role>.md, override .agents/roles/ prioritaire)"
        required: true
        type: string
      task:
        description: "Tâche confiée à l'agent"
        required: true
        type: string
      title:
        description: "Titre court des issue / PR (défaut : le rôle)"
        required: false
        type: string
        default: ""
      model:
        description: "Modèle Albert (id exact)"
        required: false
        type: string
        default: deepseek-v4-flash
      agents_ref:
        description: "Ref de ocourses/agents"
        required: false
        type: string
        default: main
      base_branch:
        description: "Branche de base (défaut : branche par défaut du dépôt)"
        required: false
        type: string
        default: ""
      assignee:
        description: "Login assigné aux issue / PR"
        required: false
        type: string
        default: ocots
      link_issue:
        description: >-
          Numéro d'une issue métier qui existe déjà avant le run (ex.
          template-migration, conventions-candidate, conventions-style).
          Si fourni, elle sert ELLE-MÊME de fil de suivi — aucune issue
          dédiée n'est créée en plus — et elle est fermée nativement
          ("Closes #N") à la fusion de la PR. Vide = une issue de suivi
          dédiée est créée (rôles sans issue d'origine).
        required: false
        type: string
        default: ""
    secrets:
      ALBERT_API_KEY:
        required: true
      AGENTS_READ_TOKEN:
        required: true

concurrency:
  group: agent-albert-${{ github.repository }}
  cancel-in-progress: false

jobs:
  agent:
    name: "Agent · ${{ inputs.role }}"
    runs-on: ubuntu-latest
    steps:
      # Vigie main (avant) — l'agent travaille avec un accès shell complet et
      # un remote déjà authentifié en écriture. Rien ne l'empêche
      # TECHNIQUEMENT de pousser directement sur la branche par défaut au
      # lieu de la sienne (bug, confusion, instruction adverse cachée dans un
      # fichier qu'il lit) ; ces dépôts sont privés donc pas protégeables côté
      # serveur (GitHub Free — voir README, section Sécurité). Cette paire de
      # steps (ici + tout en bas) est le seul filet : elle ne PRÉVIENT rien,
      # elle détecte après coup et alerte bruyamment.
      - name: Vigie main (avant)
        id: main_before
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="${{ inputs.base_branch }}"
          [ -n "$base" ] || base="$(gh repo view "$REPO" --json defaultBranchRef -q .defaultBranchRef.name)"
          sha="$(gh api "repos/$REPO/commits/$base" --jq .sha)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Surveillé : $base @ $sha"

      - name: Vérifier les secrets
        env:
          ALBERT: ${{ secrets.ALBERT_API_KEY }}
          PAT: ${{ secrets.AGENTS_READ_TOKEN }}
        run: |
          test -n "$ALBERT" || { echo "::error::ALBERT_API_KEY absent (secret de dépôt requis)"; exit 1; }
          test -n "$PAT"    || { echo "::error::AGENTS_READ_TOKEN absent (secret de dépôt requis)"; exit 1; }

      - name: Checkout du dépôt appelant
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout de la base d'agents
        uses: actions/checkout@v4
        with:
          repository: ocourses/agents
          ref: ${{ inputs.agents_ref }}
          path: _agents
          persist-credentials: false
          token: ${{ secrets.AGENTS_READ_TOKEN }}

      - name: Sous-modules privés (lecture via PAT)
        env:
          TOKEN: ${{ secrets.AGENTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -f .gitmodules || { echo "pas de sous-module"; exit 0; }
          git config -f .gitmodules --get-regexp '^submodule\..*\.url$' \
          | while read -r key url; do
              name="${key#submodule.}"; name="${name%.url}"
              path=$(git config -f .gitmodules --get "submodule.${name}.path")
              auth=$(printf '%s\n' "$url" | sed -E "s#^(git@github\.com:|https://github\.com/)#https://x-access-token:${TOKEN}@github.com/#")
              https=$(printf '%s\n' "$url" | sed -E 's#^git@github\.com:#https://github.com/#')
              git -c "submodule.${name}.url=${auth}" submodule update --init --depth 1 "$path"
              git config "submodule.${name}.url" "$https"
            done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Outil latex-compile (PATH + image TeX Live préchargée)
        run: |
          set -eu
          chmod +x _agents/bin/* || true
          echo "${GITHUB_WORKSPACE}/_agents/bin" >> "$GITHUB_PATH"
          docker pull -q ghcr.io/xu-cheng/texlive-full:latest

      - name: Chantier (issue, branche, suivi, PR Draft)
        id: scaffold
        env:
          GH_TOKEN: ${{ github.token }}
          ROLE: ${{ inputs.role }}
          TASK: ${{ inputs.task }}
          TITLE: ${{ inputs.title }}
          ASSIGNEE: ${{ inputs.assignee }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          LINK_ISSUE: ${{ inputs.link_issue }}
          RUN_ID: ${{ github.run_id }}
          MODEL: ${{ inputs.model }}
          REPO: ${{ github.repository }}
        run: bash _agents/scripts/scaffold.sh

      - name: Travail (OpenCode)
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          AGENTS_DIR: _agents
          ROLE: ${{ inputs.role }}
          TASK: ${{ inputs.task }}
          MODEL: ${{ inputs.model }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.scaffold.outputs.branch }}
          ISSUE: ${{ steps.scaffold.outputs.issue }}
          PR: ${{ steps.scaffold.outputs.pr }}
          TRACKING: ${{ steps.scaffold.outputs.tracking }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bash _agents/scripts/run-opencode.sh

      - name: Push du travail
        if: always() && steps.scaffold.outputs.branch != ''
        env:
          BRANCH: ${{ steps.scaffold.outputs.branch }}
        run: |
          git config user.name  "ocourses-agent"
          git config user.email "agent@users.noreply.github.com"
          git push origin "HEAD:${BRANCH}" || true

      - name: Clôture (suivi + commentaire de bilan)
        if: always() && steps.scaffold.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.scaffold.outputs.pr }}
          BRANCH: ${{ steps.scaffold.outputs.branch }}
          TRACKING: ${{ steps.scaffold.outputs.tracking }}
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ job.status }}
        run: bash _agents/scripts/finalize.sh

      - name: Journaux (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ github.run_id }}
          path: _agent_logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Vigie main (après)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          base="${{ steps.main_before.outputs.base }}"
          before="${{ steps.main_before.outputs.sha }}"
          [ -n "$base" ] && [ -n "$before" ] || { echo "::warning::vigie main non armée (étape 'avant' n'a pas produit de sortie) — ignorée."; exit 0; }
          after="$(gh api "repos/$REPO/commits/$base" --jq .sha)"
          if [ "$after" = "$before" ]; then
            echo "$base inchangé pendant ce run ($before) — OK."
            exit 0
          fi
          author="$(gh api "repos/$REPO/commits/$after" --jq '.commit.author.name')"
          if [ "$author" = "ocourses-agent" ]; then
            echo "::error::ALERTE — $base a bougé pendant ce run ($before -> $after), dernier commit signé ocourses-agent : l'agent a probablement poussé dessus directement."
            gh label create agent:failed --repo "$REPO" --color b60205 \
              --description "Run en échec — vérifier avant de remettre en file" 2>/dev/null || true
            tmp_body="$(mktemp)"
            printf '%s\n' \
              "Détecté par la vigie post-run : \`$base\` est passé de \`$before\` à \`$after\` pendant ce run, et le dernier commit est signé \`ocourses-agent\` — pas une fusion humaine normale." \
              "" \
              "**À vérifier immédiatement** : \`git log $before..$after\` sur \`$base\`, et envisager un revert si le contenu n'a pas été relu." \
              "" \
              "Run : $RUN_URL" \
              > "$tmp_body"
            gh issue create --repo "$REPO" --label agent:failed \
              --title "🚨 Agent a poussé sur $base (run ${{ github.run_id }})" \
              --body-file "$tmp_body" >/dev/null || echo "::warning::alerte critique mais création d'issue impossible (permissions ?)"
          else
            echo "::notice::$base a bougé pendant ce run ($before -> $after), mais le dernier commit n'est pas signé ocourses-agent — probablement une activité humaine concurrente, sans lien avec ce run."
          fi
