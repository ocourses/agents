name: Compilation LaTeX (PR)

# Workflow RÉUTILISABLE : compile les documents .tex touchés par une PR
# (directement ou via un \input), poste le résultat en commentaire et
# **joint les PDF produits en artefact**. Centralisé ici parce qu'il était
# dupliqué au caractère près dans chaque dépôt de cours (même genre de
# généricité que check.yml / agent.yml, mais copié-collé au lieu d'être
# partagé) — voir ocourses/agents#2.
#
# Une référence non résolue (`??` dans le PDF) ou un label multiplement
# défini fait échouer la PR, même si la compilation passe : lus dans le
# `.log` final (ocots-conventions C5 : « Un `??` dans le PDF est un bug » ;
# ocots-lint, décision 0006). Les clés sont listées dans le commentaire.
#
# Ne tourne que sur les PR **non-Draft** (condition posée dans le dispatcher
# du dépôt appelant, pas ici : `workflow_call` ne peut pas être déclenché
# directement par `pull_request`). latexmk tourne dans le conteneur
# ghcr.io/xu-cheng/texlive-full via `docker run` : le job lui-même est sur
# ubuntu-latest, seul TeX Live est conteneurisé. Aucun script partagé
# d'`ocourses/agents` référencé ici — pas besoin de checkout `_agents`.
#
# Runner : ubuntu-latest, sauf si la variable OCOURSES_RUNNER (organisation
# ou dépôt) en désigne un autre — bascule manuelle vers le runner Occidata
# quand le quota de minutes est épuisé (control-toolbox/occidata,
# docs/gha-runner-config.md § 9). Occidata n'a pas Docker : sur un runner
# auto-hébergé, latexmk est celui du runner (TeX Live du cluster). Sur
# GitHub, rien ne change.
#
# Le dépôt appelant fournit :
#
#   on:
#     pull_request:
#       types: [synchronize, ready_for_review, reopened]
#       paths: ["**/*.tex", "**/*.sty", "**/*.cls", "**/.latexmkrc", ".gitmodules"]
#   permissions: { contents: read, pull-requests: write }
#   jobs:
#     compile:
#       if: github.event.pull_request.draft == false
#       uses: ocourses/agents/.github/workflows/latex-pr.yml@main
#       secrets:
#         AGENTS_READ_TOKEN: ${{ secrets.AGENTS_READ_TOKEN }}

on:
  workflow_call:
    secrets:
      AGENTS_READ_TOKEN:
        required: true

concurrency:
  group: latex-pr-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TEXLIVE_IMAGE: ghcr.io/xu-cheng/texlive-full:latest

jobs:
  compile:
    runs-on: ${{ fromJSON(vars.OCOURSES_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout de la PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Sous-module template (PAT lecture)
        env:
          TOKEN: ${{ secrets.AGENTS_READ_TOKEN }}
        run: |
          set -eu
          test -f .gitmodules || exit 0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config -f .gitmodules --get-regexp '^submodule\..*\.url$' \
          | while read -r key url; do
              name="${key#submodule.}"; name="${name%.url}"
              path=$(git config -f .gitmodules --get "submodule.${name}.path")
              https=$(printf '%s\n' "$url" | sed -E 's#^(git@github\.com:|https://github\.com/)#https://github.com/#')
              auth=$(printf '%s\n' "$https" | sed -E "s#^https://github\.com/#https://x-access-token:${TOKEN}@github.com/#")
              git -c "submodule.${name}.url=${auth}" submodule update --init --depth 1 "$path"
              git config "submodule.${name}.url" "$https"
            done

      - name: Documents à compiler
        id: docs
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" \
                    | grep -E '\.(tex|sty|cls)$|\.latexmkrc$' || true)

          # Fichiers « pilotes » = .tex avec \documentclass, hors template/.
          mains=$(grep -rlZ --include='*.tex' '\\documentclass' . 2>/dev/null \
                  | tr '\0' '\n' | sed 's#^\./##' | grep -v '^template/' || true)

          # Un pilote est à compiler si un fichier modifié est : lui-même, dans
          # son arborescence, ou tiré par un \input / \include (match sur le
          # nom de base sans extension).
          : > docs.txt
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            mdir=$(dirname "$m")
            hit=0
            while IFS= read -r c; do
              [ -n "$c" ] || continue
              cbase=$(basename "$c"); cstem="${cbase%.tex}"
              case "$c" in
                "$m") hit=1;;
                "$mdir"/*) hit=1;;
                *.tex)
                  grep -qE "\\\\(input|include|subfile)\{[^}]*${cstem}(\.tex)?\}" "$m" 2>/dev/null && hit=1;;
              esac
              [ "$hit" = 1 ] && break
            done <<< "$changed"
            [ "$hit" = 1 ] && echo "$m" >> docs.txt
          done <<< "$mains"

          sort -u -o docs.txt docs.txt
          echo "Documents à compiler :"
          sed 's/^/  - /' docs.txt || true
          echo "count=$(grep -c . docs.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Compilation (TeX Live)
        if: steps.docs.outputs.count != '0'
        id: build
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          set -u
          # texrun <dossier> <commande...> : TeX Live conteneurisé sur GitHub,
          # celui du runner sur un runner auto-hébergé (pas de Docker).
          # max_print_line : le .log ne coupe pas les lignes à 79 colonnes,
          # une clé longue y reste lisible d'un seul tenant.
          export max_print_line=10000
          if [ "$RUNNER_ENV" = github-hosted ]; then
            docker pull -q "$TEXLIVE_IMAGE"
            texrun() { docker run --rm -e max_print_line -v "$PWD":/w -w "/w/$1" "$TEXLIVE_IMAGE" "${@:2}"; }
          else
            texrun() { (cd "$1" && "${@:2}"); }
          fi
          # aux_dir des .latexmkrc du dépôt = build/ : chercher le log là aussi
          trouver_log() {
            for c in "$1/build/${2%.tex}.log" "$1/${2%.tex}.log"; do
              [ -f "$c" ] && { echo "$c"; return; }
            done
          }
          # renvois <log> : « non résolue<TAB>clé » et « dupliqué<TAB>clé »
          # du .log final (les doublons `clé@cref` de cleveref sont écartés).
          renvois() {
            python3 - "$1" <<'PY'
          import re, sys
          motifs = (
              ("non résolue", r"(?:LaTeX|Hyper) (?:Warning: )?[Rr]eference `([^']+)' on page \S+ undefined"),
              ("dupliqué", r"LaTeX Warning: Label `([^']+)' multiply defined"),
          )
          texte = open(sys.argv[1], encoding="latin-1").read()
          for genre, motif in motifs:
              for cle in sorted({c for c in re.findall(motif, texte) if not c.endswith("@cref")}):
                  print(f"{genre}\t{cle}")
          PY
          }
          rc=0
          : > report.md
          mkdir -p _artifacts
          {
            echo "## Compilation LaTeX"
            echo
          } >> report.md
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            dir=$(dirname "$f"); bse=$(basename "$f")
            echo "::group::latexmk $f"
            if texrun "$dir" \
                 latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error "$bse"; then
              log=$(trouver_log "$dir" "$bse")
              pb=""
              [ -n "$log" ] && pb=$(renvois "$log")
              if [ -z "$pb" ]; then
                echo "- ✅ \`$f\`" >> report.md
              else
                rc=1
                nr=$(grep -c '^non résolue' <<< "$pb" || true)
                nd=$(grep -c '^dupliqué' <<< "$pb" || true)
                {
                  echo "- ❌ \`$f\` — compilé, mais $nr référence(s) non résolue(s) (\`??\`), $nd label(s) multiplement défini(s)"
                  echo "  <details><summary>Clés — <code>$f</code></summary>"
                  echo
                  printf '%s\n' "$pb" | awk -F'\t' '{ printf "  - %s : `%s`\n", $1, $2 }'
                  echo
                  echo "  </details>"
                } >> report.md
                cp "$log" "_artifacts/$(echo "${f%.tex}.log" | tr / -)"
              fi
            else
              rc=1
              echo "- ❌ \`$f\`" >> report.md
              log=$(trouver_log "$dir" "$bse")
              if [ -n "$log" ]; then
                errs=$(grep -E ':[0-9]+:|^!|^l\.[0-9]+|Undefined control|Runaway|Missing|Not in outer|Emergency stop|.*Error' "$log" | head -60 || true)
                {
                  # <details> indenté sous l'item : un bloc HTML au niveau
                  # colonne 0 absorberait les items suivants (pas de ligne
                  # vide après </details>) et casserait la liste.
                  echo "  <details><summary>Erreurs — <code>$f</code></summary>"
                  echo
                  if [ -n "$errs" ]; then
                    echo '  ```'
                    printf '%s\n' "$errs" | sed 's/^/  /'
                    echo '  ```'
                  else
                    echo "  _Aucune erreur extraite — voir le log complet en artefact._"
                  fi
                  echo
                  echo "  </details>"
                } >> report.md
                cp "$log" "_artifacts/$(echo "${f%.tex}.log" | tr / -)"
              fi
            fi
            for c in "$dir/${bse%.tex}.pdf" "$dir/build/${bse%.tex}.pdf"; do
              [ -f "$c" ] && { cp "$c" "_artifacts/$(echo "${f%.tex}.pdf" | tr / -)"; break; }
            done
            echo "::endgroup::"
          done < docs.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Artefact (PDF + logs)
        if: steps.docs.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: latex-pr-${{ github.event.pull_request.number }}
          path: _artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Commentaire de PR
        if: steps.docs.outputs.count != '0'
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          body = open("report.md").read().rstrip()
          body += f"\n\n📎 PDF et logs : [artefact du run]({os.environ['RUN_URL']}#artifacts)"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR']}/comments",
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers={"Authorization": f"Bearer {os.environ['TOKEN']}",
                       "Accept": "application/vnd.github+json"})
          urllib.request.urlopen(req)
          print("commentaire posté")
          PY

      - name: Statut
        if: steps.docs.outputs.count != '0' && steps.build.outputs.rc != '0'
        run: exit 1
